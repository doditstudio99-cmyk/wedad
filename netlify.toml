# Free hosting of the Dodit Studio website on Netlify (Google Sheets version).
# The site is plain static files; bookings go to the Apps Script URL in google-sheets/web-app-url.txt,
# which the build writes into js/config.js.
[build]
  base = "website/public"
  publish = "."
  command = "node ../../google-sheets/write-config.cjs"

# The admin panel needs the Next.js server; in the free version the Google Sheet is the admin panel.
[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/admin"
  to = "/"
  status = 302
