<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Cairo:wght@600;800;900&display=block" rel="stylesheet">
<style>
  :root{
    --orange:#ff7a1a; --orange2:#ffb020; --red:#e0202e; --dark:#120806;
    --wa:#25d366;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000}
  .ad{
    position:relative; width:1080px; height:1350px; overflow:hidden;
    background:var(--dark); font-family:'Cairo',sans-serif; color:#fff;
  }
  /* photo */
  .photo{
    position:absolute; inset:0 0 auto 0; height:800px;
    background:url(source.jpg) no-repeat; background-size:1080px auto; background-position:50% 0;
    filter:saturate(1.15) contrast(1.05);
    -webkit-mask-image:linear-gradient(#000 70%, transparent 100%); mask-image:linear-gradient(#000 70%, transparent 100%);
  }
  .photo::after{
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(18,8,6,.55) 0%, rgba(18,8,6,0) 18%, rgba(18,8,6,0) 52%, rgba(18,8,6,.85) 80%, var(--dark) 100%);
  }
  /* glow behind headline */
  .glow{position:absolute; left:50%; top:790px; width:1100px; height:520px; transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(255,122,26,.45), rgba(255,122,26,0)); }

  /* top strip */
  .topbar{position:absolute; top:34px; right:40px; left:40px; display:flex; justify-content:space-between; align-items:center; z-index:3}
  .urgent{
    display:flex; align-items:center; gap:12px;
    background:var(--red); color:#fff; font-weight:900; font-size:30px;
    padding:10px 26px 12px; border-radius:999px;
    box-shadow:0 0 0 6px rgba(224,32,46,.3), 0 10px 30px rgba(0,0,0,.4);
  }
  .dot{width:14px;height:14px;border-radius:50%;background:#fff; box-shadow:0 0 0 5px rgba(255,255,255,.35)}

  /* headline */
  .hook{
    position:absolute; top:522px; width:100%; text-align:center; z-index:3;
  }
  .hook .q{
    display:inline-block; font-size:36px; font-weight:800;
    background:rgba(0,0,0,.55); border:2px solid rgba(255,255,255,.25);
    padding:6px 28px 10px; border-radius:14px; backdrop-filter:blur(4px);
  }
  .yadr{
    position:absolute; top:612px; width:100%; text-align:center; z-index:4;
  }
  .yadr span{
    display:inline-block; transform:rotate(-3deg);
    font-family:'Baloo Bhaijaan 2'; font-weight:800; font-size:104px; line-height:1.15;
    color:#fff; padding:0 44px 6px;
    background:linear-gradient(90deg,var(--orange),var(--orange2));
    border-radius:26px; box-shadow:0 14px 0 #a83c00, 0 24px 40px rgba(0,0,0,.5);
  }
  .big{
    position:absolute; top:770px; width:100%; text-align:center; z-index:3;
    font-family:'Baloo Bhaijaan 2'; font-weight:800; font-size:190px; line-height:1;
    color:#fff; letter-spacing:-2px;
    text-shadow:0 8px 0 #c4500a, 0 16px 0 #7a2d03, 0 30px 50px rgba(0,0,0,.6);
  }
  .big b{color:var(--orange2); font-weight:800}

  /* offer row */
  .offer{
    position:absolute; top:1010px; width:100%; display:flex; justify-content:center; align-items:center; gap:26px; z-index:3;
  }
  .seat{
    background:#fff; color:var(--dark); font-weight:900; font-size:34px;
    padding:12px 26px 14px; border-radius:16px; line-height:1.2; box-shadow:0 10px 26px rgba(0,0,0,.4); text-align:center;
  }
  .seat small{display:block; font-size:22px; font-weight:800; color:var(--red)}
  .price{
    position:relative; display:flex; align-items:center; gap:22px;
    background:linear-gradient(135deg,var(--orange),#ff4d1a); border-radius:22px;
    padding:10px 70px 14px 32px; box-shadow:0 12px 30px rgba(255,90,20,.45);
  }
  .now{font-size:96px; font-weight:900; line-height:1; letter-spacing:-1px}
  .now small{font-size:30px; font-weight:800; margin-right:6px}
  .old{font-size:44px; font-weight:800; opacity:.85; position:relative; line-height:1}
  .old::after{content:""; position:absolute; left:-6px; right:-6px; top:52%; height:5px; background:#fff; transform:rotate(-12deg); border-radius:4px}
  .save{
    position:absolute; top:-46px; right:-50px; transform:rotate(12deg);
    background:#ffe14d; color:#3a1500; font-weight:900; font-size:26px; line-height:1.1;
    width:118px; height:118px; border-radius:50%; display:flex; align-items:center; justify-content:center; text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.4); border:4px dashed #3a1500;
  }

  /* CTA */
  .cta{
    position:absolute; bottom:40px; left:40px; right:40px; z-index:3;
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:26px; padding:14px 14px 14px 30px;
    box-shadow:0 14px 40px rgba(0,0,0,.5);
  }
  .btn{
    display:flex; align-items:center; gap:14px; background:var(--wa); color:#fff;
    font-weight:900; font-size:36px; padding:10px 30px 16px; border-radius:18px;
  }
  .btn svg{width:46px;height:46px; margin-top:6px}
  .num{color:var(--dark); font-weight:900; font-size:52px; direction:ltr; letter-spacing:1px}
  .num small{display:block; font-size:22px; font-weight:800; color:#777; text-align:right; direction:rtl; letter-spacing:0; margin-bottom:-6px}
</style>
</head>
<body>
<div class="ad">
  <div class="photo"></div>
  <div class="glow"></div>

  <div class="topbar">
    <div class="urgent"><span class="dot"></span>عرض لفترة محدودة</div>
    <div></div>
  </div>

  <div class="hook"><span class="q">عايز عيادتك تبقى التريند؟</span></div>
  <div class="yadr"><span>يا دكتور</span></div>
  <div class="big">الـ <b>10</b> ريلز</div>

  <div class="offer">
    <div class="price">
      <div class="save">وفّر<br>2500</div>
      <div class="now">3500<small>جنيه</small></div>
      <div class="old">6000</div>
    </div>
    <div class="seat">لأول 10 عملاء<small>فقط!</small></div>
  </div>

  <div class="cta">
    <div class="btn">
      <svg viewBox="0 0 32 32" fill="#fff"><path d="M16 3C9 3 3.3 8.6 3.3 15.6c0 2.4.7 4.7 1.9 6.7L3 29l6.9-2.2c1.9 1 4 1.6 6.1 1.6 7 0 12.7-5.7 12.7-12.7S23 3 16 3zm0 23.1c-2 0-3.9-.6-5.5-1.6l-.4-.2-4.1 1.3 1.3-4-.3-.4c-1.1-1.7-1.7-3.6-1.7-5.6C5.3 9.8 10.1 5 16 5s10.7 4.8 10.7 10.6S21.9 26.1 16 26.1zm5.9-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.3-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.7 5 .8.3 1.4.5 1.9.7.8.3 1.5.2 2.1.1.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>
      احجز مكانك دلوقتي
    </div>
    <div class="num"><small>فون أو واتساب</small>01025560533</div>
  </div>
</div>
</body>
</html>
